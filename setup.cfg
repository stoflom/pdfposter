[sdist]
formats=gztar

[bdist_wheel]
universal=1

[metadata]
name         = pdftools.pdfposter
version      = attr: pdftools.pdfposter.__version__
description  = Scale and tile PDF images/pages to print on multiple pages.
long_description = file: README.txt
long_description_content_type = text/x-rst
url          = https://pdfposter.readthedocs.io/
download_url = https://pypi.org/project/pdftools.pdfposter/
author       = Hartmut Goebel
author_email = h.goebel@crazy-compilers.com
license      = GNU General Public License v3 or later (GPLv3+)
keywords     = pdf, poster
classifiers =
  Development Status :: 5 - Production/Stable
  Environment :: Console
  Intended Audience :: Developers
  Intended Audience :: End Users/Desktop
  Intended Audience :: System Administrators
  License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
  Natural Language :: English
  Operating System :: OS Independent
  Programming Language :: Python
  Programming Language :: Python :: 2
  Programming Language :: Python :: 2.7
  Programming Language :: Python :: 3
  Programming Language :: Python :: 3.4
  Programming Language :: Python :: 3.5
  Programming Language :: Python :: 3.6
  Topic :: Printing
  Topic :: Utilities

[options]
packages = pdftools.pdfposter
namespace_packages = pdftools
include_package_data = True
zip_safe = True
install_requires =
  PyPDF2 < 1.28

[options.entry_points]
console_scripts =
  pdfposter = pdftools.pdfposter.cmd:run

[zest.releaser]
history-file = CHANGES
push-changes = no
tag-format = v{version}
tag-message = pdfposter {version}
tag-signing = yes
create-wheel = yes
