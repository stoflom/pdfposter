[tox]
envlist = py27, py34, py35, py36, linters

[testenv]
deps =
     pep8
     pytest

commands =
     py.test


#--- Linters ---

[testenv:pylint]
basepython = python3
skip_install = true
deps =
    pyflakes
    pylint
commands =
    pylint pdftools/pdfposter/

[testenv:linters]
basepython = python3
skip_install = true
deps =
    {[testenv:pylint]deps}
    {[testenv:readme]deps}
commands =
    {[testenv:pylint]commands}
    {[testenv:readme]commands}


#--- Documentation ---

[testenv:readme]
basepython = python3
deps =
    readme_renderer
commands =
    python setup.py check -r -s

