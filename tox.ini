[tox]
env_list = clean,py,linters
requires =
    tox>=4

[testenv]
base_python = python3
# get shorter paths in coverage reporting
package = editable
deps =
     pytest
     pytest-cov
commands =
     pytest --cov=pdfposter --no-cov-on-fail \
            --cov-report=term-missing \
            test/unit test/functional
depends =
    py: clean
set_env =
   LANGUAGE = C

[testenv:clean]
deps = coverage
package = skip
commands = coverage erase

[coverage:run]
include = pdfposter
omit =
   pdfposter/__main__.py
   pdfposter/gui.py

#--- Linters ---

[testenv:pylint]
base_python = python3
package = editable
deps =
    pyflakes
    pylint
commands =
    pylint pdfposter/ setup.py

[testenv:linters]
base_python = python3
package = skip
deps =
    {[testenv:pylint]deps}
    {[testenv:readme]deps}
commands =
    {[testenv:pylint]commands}
    {[testenv:readme]commands}


#--- Documentation ---

[testenv:readme]
base_python = python3
package = skip
deps =
    build
    twine
commands =
    python -m build --outdir "{env_tmp_dir}/dist"
    twine check "{env_tmp_dir}"/dist/*
