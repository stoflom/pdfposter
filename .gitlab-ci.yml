before_script:
  - python --version
  - pip install -U pip setuptools wheel
  - pip install -r dev-requirements.txt
  # Generate test input-file (using Scons for this is overhead)
  - python test/gen-chessboard.py test/chessboard.pdf

python3.6:
  image: python:3.6
  script:
    - tox -e py36

python3.7:
  image: python:3.7
  script:
    - tox -e py37

python3.8:
  image: python:3.8
  script:
    - tox -e py38

python3.9:
  image: python:3.9
  script:
    - tox -e py39

python3.10:
  image: python:3.10
  script:
    - tox -e py310

python3.11:
  image: python:3.11
  script:
    - tox -e py311

linters:
