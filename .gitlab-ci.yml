before_script:
  - python --version
  - pip install -U pip setuptools wheel
  - pip install -r dev-requirements.txt
  # Generate test input-file (using Scons for this is overhead)
  - python test/gen-chessboard.py test/chessboard.pdf

test:
  image: python:${PYTHON_VERSION}
  script: tox -e "py${PYTHON_VERSION/./}"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.6", "3.7", "3.8", "3.9", "3.10", "3.11"]

linters:
  image: python:3.9
  script:
    # For now only check the readme
    - tox -e readme
    #- tox -e linters

